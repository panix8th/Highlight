name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .deps/obs-runtime
            .deps/obs-deps
            .deps/obs-src
            .deps/obs.lib
          key: deps-obs-32.2.2-deps-2026-07-15-v1

      - name: Fetch OBS runtime, libobs headers and FFmpeg
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build -OutDir dist

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-windows-x64
          path: dist/Highlight
          if-no-files-found: error

      - name: Publish release (v* tags, or a manual run with a release tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Highlight ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          files: dist/Highlight-*-windows-x64.zip
          generate_release_notes: true
          body: |
            ## Install
            1. Download **`Highlight-*-windows-x64.zip`** below (under Assets).
            2. Unzip it anywhere and run **`Highlight.exe`**. No installer needed.
            3. Press **F8** in game to save the last minute. Clips go to `Videos\Highlight`.

            Windows 10 2004+ (64-bit) and a DirectX 11 GPU. NVIDIA NVENC is used when available.
            If SmartScreen warns about an unknown app, click **More info → Run anyway** (the build isn't code-signed yet).
