name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .deps/obs-runtime
            .deps/obs-deps
            .deps/obs-src
            .deps/obs.lib
          key: deps-obs-32.2.2-deps-2026-07-15-v1

      - name: Fetch OBS runtime, libobs headers and FFmpeg
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHL_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      # Replays a real H.264 + AAC recording through the rolling buffer the way libobs
      # delivers it (codec headers only in the first packet) and checks every clip.
      - name: Test clip saving
        shell: pwsh
        run: |
          $bin = (Resolve-Path .deps/obs-deps/bin).Path
          $env:PATH = "$bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path test-tmp | Out-Null
          & "$bin/ffmpeg.exe" -hide_banner -loglevel error -y `
            -f lavfi -i "testsrc2=s=640x360:r=60" -f lavfi -i "sine=f=440:r=48000" -f lavfi -i "sine=f=660:r=48000" `
            -t 150 -map 0:v -map 1:a -map 2:a -c:v libx264 -preset ultrafast `
            -x264-params "keyint=60:min-keyint=60:bframes=2:scenecut=0" -b:v 4M -c:a aac -b:a 128k test-tmp/src.mkv
          if ($LASTEXITCODE -ne 0) { throw "Could not create the test recording" }
          ./build/clip_pipeline_test.exe test-tmp/src.mkv test-tmp/work --obs-headers --speed 20
          if ($LASTEXITCODE -ne 0) { throw "Clip pipeline test failed" }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build -OutDir dist

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $cm = Get-Content CMakeLists.txt -Raw
          if ($cm -match 'project\(Highlight VERSION ([0-9.]+)') { "version=$($Matches[1])" >> $env:GITHUB_OUTPUT }

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-windows-x64
          path: dist/Highlight
          if-no-files-found: error

      # A release is published for a pushed v* tag, a manual run with a release tag,
      # or a push to main whose commit message contains [release] (tag v<CMake version>).
      - name: Pick release tag
        id: rel
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release }}
          MESSAGE: ${{ github.event.head_commit.message }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $tag = ""
          if ($env:REF -like "refs/tags/v*") { $tag = $env:REF_NAME }
          elseif ($env:EVENT -eq "workflow_dispatch" -and $env:INPUT_TAG) { $tag = $env:INPUT_TAG }
          elseif ($env:EVENT -eq "push" -and $env:REF -eq "refs/heads/main" -and $env:MESSAGE -and $env:MESSAGE.Contains("[release]")) { $tag = "v$($env:VERSION)" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: '$tag'"

      - name: Publish release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Highlight ${{ steps.rel.outputs.tag }}
          files: dist/Highlight-*-windows-x64.zip
          generate_release_notes: true
          body: |
            ## Install
            1. Download **`Highlight-*-windows-x64.zip`** below (under Assets).
            2. Unzip it anywhere and run **`Highlight.exe`**. No installer needed.
            3. Press **F8** in game to save the last minute. Clips go to `Videos\Highlight`.

            Windows 10 2004+ (64-bit) and a DirectX 11 GPU. NVIDIA NVENC is used when available.
            If SmartScreen warns about an unknown app, click **More info → Run anyway** (the build isn't code-signed yet).
